<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Japantown Living Mural (Open-Source AR)</title>

    <!-- Open-source stack: stock A-Frame + our custom MindAR build (no cloud, no backend).
         The custom bundle is MindAR 1.2.5 compiled from source with loosened
         confidence thresholds so the bronze relief locks on much more easily —
         rebuild with `npm run build-tracker` in tools/mind-compile/. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="./assets/vendor/mindar-image-aframe.custom.js"></script>

    <!-- Project source -->
    <script type="module" src="./src/utils/math-utils.js"></script>
    <script type="module" src="./src/utils/audio-utils.js"></script>
    <script type="module" src="./src/components/mural-geo-gate.js"></script>
    <script type="module" src="./src/components/mural-plane.js"></script>

    <link rel="stylesheet" href="./src/css/mural-ar-styles.css" />
    <link rel="stylesheet" href="./src/css/navigation.css" />
</head>

<body>
    <div id="topbar">
        <a href="./index.html" class="back" aria-label="Back to home">&larr;</a>
        <h1>Japantown Living Mural</h1>
    </div>

    <div id="mural-status" class="visible">Finding your location…</div>
    <button id="mural-start">Start</button>

    <!--
      MindAR scene. autoStart:false so the GPS gate controls when the camera
      turns on. assets/targets/japan-am.mind holds six compiled targets:
      front relief (indices 0-2) and back relief (indices 3-5), three lighting
      variants each — recompile via `npm run compile-targets` in
      tools/mind-compile/ when better on-site photos are available.
    -->
    <a-scene
        mindar-image="imageTargetSrc: ./assets/targets/japan-am.mind; autoStart: false; uiScanning: no; uiLoading: no; maxTrack: 1; missTolerance: 15; warmupTolerance: 2; filterMinCF: 0.001; filterBeta: 0.05"
        mural-geo-gate="lat: 37.334900; lng: -121.894400; radius: 40; bypass: true"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- Temporary static overlays from the MindAR training set (even lighting).
                 Swap these for the real animated mural mp4s when they're ready —
                 use <video id="…" muted playsinline loop> and point mural-plane
                 + the a-plane material src at those videos. -->
            <img id="muralImgFront" src="./assets/Markers/japan-am-front-even.jpg" crossorigin="anonymous">
            <img id="muralImgBack" src="./assets/Markers/japan-am-back-even.jpg" crossorigin="anonymous">
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Two physical targets (front + back reliefs), each compiled from
             three on-site photos under different lighting (indices 0-2 front,
             3-5 back). mural-plane enforces a single active anchor across ALL
             variants: whichever one locks first renders its plane, the others
             keep tracking silently with their planes hidden — so you only ever
             see one plane, front or back. Plane heights match each source
             photo's aspect ratio (h/w at 1600px wide). -->
        <a-entity mindar-image-target="targetIndex: 0" mural-plane>
            <a-plane width="1" height="0.4038"
                     material="shader: flat; src: #muralImgFront; side: double; transparent: true"></a-plane>
        </a-entity>
        <a-entity mindar-image-target="targetIndex: 1" mural-plane>
            <a-plane width="1" height="0.3931"
                     material="shader: flat; src: #muralImgFront; side: double; transparent: true"></a-plane>
        </a-entity>
        <a-entity mindar-image-target="targetIndex: 2" mural-plane>
            <a-plane width="1" height="0.4000"
                     material="shader: flat; src: #muralImgFront; side: double; transparent: true"></a-plane>
        </a-entity>
        <a-entity mindar-image-target="targetIndex: 3" mural-plane>
            <a-plane width="1" height="0.4250"
                     material="shader: flat; src: #muralImgBack; side: double; transparent: true"></a-plane>
        </a-entity>
        <a-entity mindar-image-target="targetIndex: 4" mural-plane>
            <a-plane width="1" height="0.3856"
                     material="shader: flat; src: #muralImgBack; side: double; transparent: true"></a-plane>
        </a-entity>
        <a-entity mindar-image-target="targetIndex: 5" mural-plane>
            <a-plane width="1" height="0.3981"
                     material="shader: flat; src: #muralImgBack; side: double; transparent: true"></a-plane>
        </a-entity>
    </a-scene>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
