<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Selfie AR</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css?v=2" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    <!-- Field log: first script on the page so it sees everything; inert unless ?debug=1 or ?log=1. -->
    <script src="./assets/js/sharks-way-log.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/utils/checkpoint-loader.js"></script>
    <script type="module" src="./src/utils/shared-map-markers.js"></script>
    <!-- Sammy and Sharkie are Draco-compressed: decode with the vendored decoder
         (assets/vendor/draco), not gstatic. Has to run before model-viewer loads —
         every <model-viewer> re-reads this config when it's created. -->
    <script>
        self.ModelViewerElement = Object.assign(self.ModelViewerElement || {}, {
            dracoDecoderLocation: new URL('./assets/vendor/draco/', location.href).href
        });
    </script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./src/css/selfie-ar-styles.css" />
    <link rel="stylesheet" href="./src/css/navigation.css" />
</head>

<body>

    <!-- Camera feed -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Shark overlay positioned at shoulder by JS -->
    <div id="shark-overlay">
        <model-viewer id="shark-viewer" src="./sammy_final_pose.glb" camera-orbit="0deg 75deg 150%"
            field-of-view="60deg" min-field-of-view="40deg" max-field-of-view="90deg" disable-zoom
            interaction-prompt="none" environment-image="neutral" shadow-intensity="0"
            style="width:250px;height:250px;background:transparent;--poster-color:transparent;">
        </model-viewer>
    </div>

    <!-- Loading -->
    <div id="selfie-loading">
        <div class="spinner"></div>
        <h2>Selfie AR</h2>
        <p id="loading-msg">Loading...</p>
    </div>

    <!-- Top bar -->
    <div id="topbar">
        <a href="./index.html">&larr;</a>
        <h1>Selfie with Sammy</h1>
        
    </div>

    <!-- DEV panel -->
    <div id="dev-panel" style="display: none;">
        <span style="font-size:10px;opacity:0.6;">🛠 DEV MODEL</span>
        <select id="glb-select">
            <option value="./assets/3D-models/plushie_shark.glb">plushie_shark</option>
            <option value="./assets/3D-models/MARIA_SHARK.glb">MARIA_SHARK</option>
            <option value="./assets/3D-models/MARIA_SHARK_ANIMATED.glb">MARIA_SHARK_ANIMATED</option>
            <option value="./assets/3D-models/SHAUN_SHARK.glb">SHAUN_SHARK</option>
            <option value="./assets/3D-models/SHAUN_SHARK_ANIMATED.glb">SHAUN_SHARK_ANIMATED</option>
            <option value="./assets/3D-models/STELLA_CAI_SHARK_SJSU_TEST1.glb">STELLA_CAI_SHARK</option>
            <option value="./assets/3D-models/mock_up_eoe_map.glb">mock_up_eoe_map</option>
            <option value="./assets/3D-models/Pose_sharky_01.glb">Pose_sharky_01</option>
            <option value="./assets/3D-models/Pose_sharky_01._no_glass.glb">Pose_sharky_01_no_glass</option>
            <option value="./assets/3D-models/Pose_sharky_02.glb">Pose_sharky_02</option>
            <option value="./sammy_final_pose.glb" selected>sammy_final_pose</option>
        </select>
        <div id="pose-status">No pose detected</div>
        <label>Anchor:</label>
        <select id="anchor-select">
            <option value="left">Left shoulder</option>
            <option value="right">Right shoulder</option>
            <option value="mid" selected>Between shoulders</option>
        </select>
        <label>Size: <span id="size-val">250</span>px</label>
        <input type="range" id="size-slider" min="80" max="700" step="10" value="250">
        <label>Y nudge: <span id="y-nudge-val">-110</span>px</label>
        <input type="range" id="y-nudge" min="-300" max="300" step="5" value="-110">
        <label>X nudge: <span id="x-nudge-val">0</span>px</label>
        <input type="range" id="x-nudge" min="-200" max="200" step="5" value="0">
    </div>

    <div id="selfie-hint">Step back so your shoulders are visible</div>

    <!-- Map Component -->
    <div id="map-container">
        <button id="toggle-map" aria-label="Open map">
            <svg class="map-fab-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="2,5 9,3 9,21 2,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="9,3 17,5 17,23 9,21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.55)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="17,5 24,3 24,21 17,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <path d="M5 14 Q7 10 9 12 Q11 14 13 10" stroke="#00A9E0" stroke-width="1.3" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
                <path
                    d="M19 4.5 C17.07 4.5 15.5 6.07 15.5 8 C15.5 10.5 19 14.5 19 14.5 C19 14.5 22.5 10.5 22.5 8 C22.5 6.07 20.93 4.5 19 4.5Z"
                    fill="#00A9E0" stroke="rgba(0,18,24,0.4)" stroke-width="0.8" />
                <circle cx="19" cy="8" r="1.6" fill="rgba(0,18,24,0.55)" />
            </svg>
            <span class="map-icon-close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </span>
        </button>
        <div id="mini-map"></div>
    </div>

    <div id="selfie-controls">
        <button id="selfie-snap"></button>
    </div>

    <div id="selfie-flash"></div>

    <div id="selfie-preview">
        <div id="selfie-preview-label">Your Sharks Way Selfie</div>
        <img id="selfie-preview-img" src="" alt="Selfie">
        <div id="selfie-preview-actions">
            <button id="btn-retake">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                    <path d="M3 21v-5h5" />
                </svg>
                Retake
            </button>
            <button id="btn-save">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Save
            </button>
            <button id="btn-share">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                </svg>
                Share
            </button>
        </div>
    </div>

    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var character = urlParams.get('character') || 'sammy';

        var video = document.getElementById('video');
        var overlay = document.getElementById('shark-overlay');
        var viewer = document.getElementById('shark-viewer');
        var poseStatus = document.getElementById('pose-status');
        var DEV = { anchor: 'left', size: 250, yNudge: -110, xNudge: 70 };
        var lastPos = null;

        if (character === 'sharkey') {
            viewer.setAttribute('src', './assets/3D-models/sharkie_pose.glb');
            document.title = 'Sharks Way - Selfie with Sharkie';
            document.querySelector('#topbar h1').textContent = 'Selfie with Sharkie';
        } else {
            viewer.setAttribute('src', './sammy_final_pose.glb');
            document.title = 'Sharks Way - Selfie with Sammy';
            document.querySelector('#topbar h1').textContent = 'Selfie with Sammy';
        }

        // ─── CAMERA ───
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        }).then(function (stream) {
            video.srcObject = stream;
            video.play();
            setTimeout(function () {
                initPose();
            }, 2000);
        }).catch(function (e) {
            document.getElementById('loading-msg').textContent = 'Camera error: ' + e.message;
        });

        // ─── MEDIAPIPE POSE ───
        function initPose() {
            document.getElementById('loading-msg').textContent = 'Loading pose model...';
            var pose = new Pose({
                locateFile: function (f) {
                    return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/' + f;
                }
            });
            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            pose.onResults(onResults);

            var camera = new Camera(video, {
                onFrame: async function () {
                    await pose.send({ image: video });
                },
                width: 1280, height: 720
            });
            camera.start().then(function () {
                document.getElementById('selfie-loading').classList.add('hidden');
                setTimeout(function () {
                    document.getElementById('selfie-hint').style.opacity = '0';
                }, 5000);
            });
        }

        // ─── POSE RESULTS ───
        // MediaPipe Pose landmarks: 11 = left shoulder, 12 = right shoulder
        // Coords are normalized 0-1. Video is mirrored so we flip X.
        function onResults(results) {
            if (!results.poseLandmarks) {
                poseStatus.textContent = 'No pose detected';
                poseStatus.classList.remove('detected');
                overlay.classList.remove('visible');
                return;
            }
            var lm = results.poseLandmarks;
            var leftShoulder = lm[11]; // x,y normalized
            var rightShoulder = lm[12];

            if (!leftShoulder || !rightShoulder) return;

            var W = window.innerWidth;
            var H = window.innerHeight;
            var half = DEV.size / 2;

            // Video is mirrored via CSS scaleX(-1), so flip X
            var lx = (1 - leftShoulder.x) * W;
            var ly = leftShoulder.y * H;
            var rx = (1 - rightShoulder.x) * W;
            var ry = rightShoulder.y * H;

            var px, py;
            if (DEV.anchor === 'left') { px = lx - 30; py = ly; }
            else if (DEV.anchor === 'right') { px = rx + 90; py = ry; }
            else { px = (lx + rx) / 2; py = (ly + ry) / 2; }

            px += DEV.xNudge;
            py += DEV.yNudge;

            // Allow model to move freely, no clamping
            overlay.style.left = (px - half) + 'px';
            overlay.style.top = (py - half) + 'px';
            overlay.classList.add('visible');
            viewer.style.width = DEV.size + 'px';
            viewer.style.height = DEV.size + 'px';

            poseStatus.textContent = 'Shoulders detected';
            poseStatus.classList.add('detected');
            lastPos = { px: px, py: py };
        }

        // ─── DEV CONTROLS ───
        document.getElementById('glb-select').addEventListener('change', function () {
            viewer.setAttribute('src', this.value);
        });
        document.getElementById('anchor-select').addEventListener('change', function () {
            DEV.anchor = this.value;
        });
        document.getElementById('size-slider').addEventListener('input', function () {
            DEV.size = parseInt(this.value);
            document.getElementById('size-val').textContent = DEV.size;
            viewer.style.width = DEV.size + 'px';
            viewer.style.height = DEV.size + 'px';
        });
        document.getElementById('y-nudge').addEventListener('input', function () {
            DEV.yNudge = parseInt(this.value);
            document.getElementById('y-nudge-val').textContent = DEV.yNudge;
        });
        document.getElementById('x-nudge').addEventListener('input', function () {
            DEV.xNudge = parseInt(this.value);
            document.getElementById('x-nudge-val').textContent = DEV.xNudge;
        });

        // ─── SNAP ───
        document.getElementById('selfie-snap').addEventListener('click', function () {
            var flash = document.getElementById('selfie-flash');
            flash.style.opacity = '1';
            setTimeout(function () {
                flash.style.transition = 'opacity 0.35s ease';
                flash.style.opacity = '0';
                setTimeout(function () { flash.style.transition = ''; }, 400);
            }, 60);

            // Composite: draw video frame + model-viewer canvas onto output canvas
            var out = document.createElement('canvas');
            out.width = video.videoWidth;
            out.height = video.videoHeight;
            var ctx = out.getContext('2d');

            // Calculate scale factors
            var scaleX = video.videoWidth / window.innerWidth;
            var scaleY = video.videoHeight / window.innerHeight;

            // Draw mirrored video to match live view
            ctx.save();
            ctx.translate(out.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, out.width, out.height);
            ctx.restore();

            // Draw model-viewer on top at shoulder position
            if (lastPos) {
                var mvCanvas = viewer.shadowRoot ? viewer.shadowRoot.querySelector('canvas') : null;
                if (mvCanvas) {
                    // Draw shark with same mirroring as video
                    ctx.save();
                    ctx.translate(out.width, 0);
                    ctx.scale(-1, 1);
                    // Flip X position since we're in mirrored coordinate space
                    var x = (out.width / scaleX - lastPos.px - DEV.size / 2) * scaleX;
                    var y = (lastPos.py - DEV.size / 2) * scaleY;
                    var sharkWidth = DEV.size * scaleX;
                    var sharkHeight = DEV.size * scaleY;
                    // Mirror the shark model itself
                    ctx.translate(x + sharkWidth, y);
                    ctx.scale(-1, 1);
                    ctx.drawImage(mvCanvas, 0, 0, sharkWidth, sharkHeight);
                    ctx.restore();
                }
            }

            document.getElementById('selfie-preview-img').src = out.toDataURL('image/png');
            document.getElementById('selfie-preview').classList.add('active');
        });

        // ─── PREVIEW ACTIONS ───
        document.getElementById('btn-retake').addEventListener('click', function () {
            document.getElementById('selfie-preview').classList.remove('active');
        });
        document.getElementById('btn-save').addEventListener('click', function () {
            var a = document.createElement('a');
            a.href = document.getElementById('selfie-preview-img').src;
            a.download = 'sharks-way-selfie-' + Date.now() + '.png';
            a.click();
            document.getElementById('selfie-preview').classList.remove('active');
        });
        document.getElementById('btn-share').addEventListener('click', function () {
            var imgSrc = document.getElementById('selfie-preview-img').src;
            if (navigator.share) {
                fetch(imgSrc).then(function (r) { return r.blob(); }).then(function (blob) {
                    navigator.share({ files: [new File([blob], 'sharks-way-selfie.png', { type: 'image/png' })] });
                });
            } else {
                navigator.clipboard.writeText('Check out my Sharks Way selfie!')
                    .then(function () { alert('Caption copied!'); });
            }
        });

        // Navigation Menu
        const navMenu = document.getElementById('nav-menu');
        const navOverlay = document.getElementById('nav-overlay');
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const closeMenuBtn = document.getElementById('close-menu');

        function openMenu() {
            navMenu.classList.add('open');
            navOverlay.classList.add('visible');
        }

        function closeMenu() {
            navMenu.classList.remove('open');
            navOverlay.classList.remove('visible');
        }

        hamburgerBtn.addEventListener('click', openMenu);
        hamburgerBtn.addEventListener('touchend', function (e) {
            e.preventDefault();
            openMenu();
        });

        closeMenuBtn.addEventListener('click', closeMenu);
        closeMenuBtn.addEventListener('touchend', function (e) {
            e.preventDefault();
            closeMenu();
        });

        navOverlay.addEventListener('click', closeMenu);
        navOverlay.addEventListener('touchend', function (e) {
            e.preventDefault();
            closeMenu();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && navMenu.classList.contains('open')) {
                closeMenu();
            }
        });

        // Map functionality
        var map = null;
        var userMarker = null;
        var userLat = null;
        var userLng = null;

        function initializeMap() {
            if (map) return;

            var mapContainer = document.getElementById('mini-map');
            map = L.map(mapContainer, {
                zoomControl: false,
                attributionControl: true
            }).setView([37.3352, -121.8811], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);
        }

        function updateMap() {
            if (!map || !userLat || !userLng) return;

            map.setView([userLat, userLng], 16);

            // Use shared marker system
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.contains('expanded');
            userMarker = updateMapMarkers(map, userLat, userLng, userMarker, isExpanded);
        }

        document.getElementById('toggle-map').addEventListener('click', function () {
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.toggle('expanded');


            setTimeout(function () {
                if (map) {
                    map.invalidateSize();
                    updateMap();
                }
            }, 400);
        });

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function (position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;

                    if (!map) {
                        initializeMap();
                    }
                    updateMap();
                },
                function (error) {
                    console.error('Geolocation error:', error);
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }

        setTimeout(function () {
            if (!map) {
                initializeMap();
            }
        }, 1000);
    </script>

    <!-- GPS Tracking for Checkpoints -->
    <script type="module" src="./src/utils/shared-gps-tracking.js"></script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
