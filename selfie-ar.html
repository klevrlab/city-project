<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Selfie AR</title>
    <meta name="description" content="Take a selfie with Sammy Spartan or Sharkie standing on your shoulder — no app needed.">
    <meta name="theme-color" content="#006D75">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <!-- Link previews (iMessage, Slack, social). og:image must be an absolute URL. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Selfie with Sammy or Sharkie — Sharks Way AR">
    <meta property="og:description" content="Take a selfie with Sammy Spartan or Sharkie standing on your shoulder — no app needed.">
    <meta property="og:url" content="https://klevrlab.github.io/city-project/selfie-ar.html">
    <meta property="og:image" content="https://klevrlab.github.io/city-project/assets/icons/og-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css?v=2" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    <!-- Field log: first script on the page so it sees everything; inert unless ?debug=1 or ?log=1. -->
    <script src="./assets/js/sharks-way-log.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/utils/checkpoint-loader.js"></script>
    <script type="module" src="./src/utils/shared-map-markers.js"></script>
    <!-- Sammy and Sharkie are Draco-compressed: decode with the vendored decoder
         (assets/vendor/draco), not gstatic. Has to run before model-viewer loads —
         every <model-viewer> re-reads this config when it's created. -->
    <script>
        self.ModelViewerElement = Object.assign(self.ModelViewerElement || {}, {
            dracoDecoderLocation: new URL('./assets/vendor/draco/', location.href).href
        });
    </script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./src/css/selfie-ar-styles.css" />
    <link rel="stylesheet" href="./src/css/navigation.css" />
</head>

<body>

    <!-- Camera feed -->
    <video id="video" autoplay playsinline muted></video>

    <!-- Shark overlay positioned at shoulder by JS -->
    <div id="shark-overlay">
        <!-- src is set by the script from ?character=. Framing matches the in-app
             selfie (sharks-way-modes.js): the box is sized to the screen. -->
        <model-viewer id="shark-viewer" camera-orbit="0deg 80deg 105%" camera-target="auto auto auto"
            disable-zoom disable-pan interaction-prompt="none" environment-image="neutral" shadow-intensity="0"
            style="width:210px;height:300px;background:transparent;--poster-color:transparent;">
        </model-viewer>
    </div>

    <!-- Loading -->
    <div id="selfie-loading">
        <div class="spinner"></div>
        <h2>Selfie AR</h2>
        <p id="loading-msg">Loading...</p>
    </div>

    <!-- Top bar -->
    <div id="topbar">
        <a href="./index.html">&larr;</a>
        <h1>Selfie with Sammy</h1>
        
    </div>

    <div id="selfie-hint">Step back so your shoulders are visible</div>

    <!-- Map Component -->
    <div id="map-container">
        <button id="toggle-map" aria-label="Open map">
            <svg class="map-fab-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="2,5 9,3 9,21 2,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="9,3 17,5 17,23 9,21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.55)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <polygon points="17,5 24,3 24,21 17,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <path d="M5 14 Q7 10 9 12 Q11 14 13 10" stroke="#00A9E0" stroke-width="1.3" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
                <path
                    d="M19 4.5 C17.07 4.5 15.5 6.07 15.5 8 C15.5 10.5 19 14.5 19 14.5 C19 14.5 22.5 10.5 22.5 8 C22.5 6.07 20.93 4.5 19 4.5Z"
                    fill="#00A9E0" stroke="rgba(0,18,24,0.4)" stroke-width="0.8" />
                <circle cx="19" cy="8" r="1.6" fill="rgba(0,18,24,0.55)" />
            </svg>
            <span class="map-icon-close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </span>
        </button>
        <div id="mini-map"></div>
    </div>

    <div id="selfie-controls">
        <button id="selfie-snap"></button>
    </div>

    <div id="selfie-flash"></div>

    <div id="selfie-preview">
        <div id="selfie-preview-label">Your Sharks Way Selfie</div>
        <img id="selfie-preview-img" src="" alt="Selfie">
        <div id="selfie-preview-actions">
            <button id="btn-retake">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                    <path d="M3 21v-5h5" />
                </svg>
                Retake
            </button>
            <button id="btn-save">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Save
            </button>
            <button id="btn-share">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                </svg>
                Share
            </button>
        </div>
    </div>

    <script>
        // Standalone "Selfie with Sammy / Sharkie" page (landing page + menu links).
        // Placement, capture and sharing follow the in-app selfie in
        // src/components/sharks-way-modes.js — the version the team tuned on site
        // in September (heads were cut off, the photo didn't match the screen).
        var urlParams = new URLSearchParams(window.location.search);
        // The landing page and menu link with ?character=sharkey.
        var wantSharkie = /^shark(ey|ie)$/.test(urlParams.get('character') || '');
        var CHARACTER = wantSharkie
            ? { name: 'Sharkie', src: './assets/3D-models/sharkie_final_pose.glb' }
            : { name: 'Sammy', src: './assets/3D-models/sammy_final_pose.glb' };

        var video = document.getElementById('video');
        var overlay = document.getElementById('shark-overlay');
        var viewer = document.getElementById('shark-viewer');
        var hint = document.getElementById('selfie-hint');
        var loadingMsg = document.getElementById('loading-msg');

        // Mascot box height as a fraction of the screen, and how far it stands
        // out from the right shoulder (screen px, before mirroring).
        var HEIGHT_FRAC = 0.42;
        var X_NUDGE = 50;
        var lastRect = null;          // where the mascot was drawn, for the photo
        var PHOTO_MIME = 'image/jpeg';
        var PHOTO_QUALITY = 0.92;

        function fieldLog(category, message) {
            if (window.SharksWayLog) window.SharksWayLog.add(category, message);
        }

        viewer.setAttribute('src', CHARACTER.src);
        document.title = 'Sharks Way - Selfie with ' + CHARACTER.name;
        document.querySelector('#topbar h1').textContent = 'Selfie with ' + CHARACTER.name;
        viewer.addEventListener('load', function () { fieldLog('selfie', CHARACTER.name + ' model loaded'); });
        viewer.addEventListener('error', function () { fieldLog('error', CHARACTER.name + ' model failed to load'); });

        // ─── CAMERA ───
        fieldLog('selfie', 'standalone selfie start (' + CHARACTER.name + ')');
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        }).then(function (stream) {
            video.srcObject = stream;
            var track = stream.getVideoTracks()[0];
            var s = track && track.getSettings ? track.getSettings() : {};
            fieldLog('selfie', 'front camera ' + s.width + 'x' + s.height + ' ' + (s.facingMode || ''));
            return video.play();
        }).then(function () {
            setTimeout(initPose, 500);
        }).catch(function (e) {
            fieldLog('error', 'front camera failed: ' + (e && e.name) + ': ' + (e && e.message));
            loadingMsg.textContent = e && e.name === 'NotAllowedError'
                ? 'Camera blocked — allow camera access for this site and reload.'
                : 'Camera error: ' + (e && e.message);
        });

        // ─── MEDIAPIPE POSE ───
        function initPose() {
            if (typeof Pose === 'undefined' || typeof Camera === 'undefined') {
                fieldLog('error', 'MediaPipe Pose/Camera not loaded');
                loadingMsg.textContent = 'Could not load the pose tracker — check your connection and reload.';
                return;
            }
            loadingMsg.textContent = 'Loading pose model...';
            var poseStart = performance.now();
            var firstPose = true;
            var pose = new Pose({
                locateFile: function (f) {
                    return 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/' + f;
                }
            });
            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            pose.onResults(function (results) {
                if (firstPose && results.poseLandmarks) {
                    firstPose = false;
                    fieldLog('selfie', 'first pose ' + Math.round(performance.now() - poseStart) + 'ms after start');
                }
                onResults(results);
            });

            var camera = new Camera(video, {
                onFrame: async function () {
                    try { await pose.send({ image: video }); } catch (e) { /* frame drop */ }
                },
                width: 1280, height: 720
            });
            camera.start().then(function () {
                document.getElementById('selfie-loading').classList.add('hidden');
            }).catch(function (e) {
                fieldLog('error', 'pose camera failed to start: ' + (e && e.name) + ': ' + (e && e.message));
                loadingMsg.textContent = 'Camera error: ' + (e && e.message);
            });
        }

        /**
         * Where the video is actually drawn. The preview is object-fit: cover, so
         * the frame is scaled up and cropped to fill the screen; MediaPipe's
         * landmarks are in *frame* coordinates. Mapping them straight onto the
         * window was off by the crop — the mascot's head left the screen.
         */
        function coverRect() {
            var W = window.innerWidth;
            var H = window.innerHeight;
            var vw = video.videoWidth || W;
            var vh = video.videoHeight || H;
            var scale = Math.max(W / vw, H / vh);
            var w = vw * scale;
            var h = vh * scale;
            return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
        }

        // ─── POSE RESULTS ───
        // Landmarks: 11 = left shoulder, 12 = right shoulder (normalized 0-1).
        function onResults(results) {
            // The hint is only for when there are no shoulders to stand on.
            hint.style.opacity = results.poseLandmarks ? '0' : '1';
            if (!results.poseLandmarks) {
                overlay.classList.remove('visible');
                lastRect = null;
                return;
            }
            var lm = results.poseLandmarks;
            var left = lm[11];
            var right = lm[12];
            if (!left || !right) return;

            var W = window.innerWidth;
            var H = window.innerHeight;
            var r = coverRect();
            // Mirrored preview → flip X.
            function toScreen(p) { return { x: r.x + (1 - p.x) * r.w, y: r.y + p.y * r.h }; }
            var ls = toScreen(left);
            var rs = toScreen(right);

            // Feet on the right shoulder, nudged outward and blended a little
            // toward the middle so it doesn't jitter off the edge of the body.
            var footX = (rs.x + X_NUDGE) * 0.75 + ((ls.x + rs.x) / 2) * 0.25;
            var footY = rs.y * 0.75 + ((ls.y + rs.y) / 2) * 0.25;

            // Taller than wide; shrink rather than let the head leave the screen.
            var margin = 8;
            var h = Math.round(H * HEIGHT_FRAC);
            h = Math.min(h, Math.max(140, footY - margin));
            var w = Math.round(h * 0.7);
            var x = Math.min(Math.max(footX - w / 2, margin), W - w - margin);
            var y = Math.min(Math.max(footY - h, margin), H - h - margin);

            overlay.style.left = x + 'px';
            overlay.style.top = y + 'px';
            viewer.style.width = w + 'px';
            viewer.style.height = h + 'px';
            overlay.classList.add('visible');
            lastRect = { x: x, y: y, w: w, h: h };
        }

        // ─── SNAP ───
        // Capture what the visitor sees: the cover-cropped, mirrored preview with
        // the mascot where it was drawn (model-viewer renders it via toDataURL).
        document.getElementById('selfie-snap').addEventListener('click', async function () {
            if (!video.videoWidth) return;
            var flash = document.getElementById('selfie-flash');
            flash.style.opacity = '1';
            setTimeout(function () {
                flash.style.transition = 'opacity 0.35s ease';
                flash.style.opacity = '0';
                setTimeout(function () { flash.style.transition = ''; }, 400);
            }, 60);

            var t0 = performance.now();
            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var W = window.innerWidth;
            var H = window.innerHeight;
            var out = document.createElement('canvas');
            out.width = Math.round(W * dpr);
            out.height = Math.round(H * dpr);
            var ctx = out.getContext('2d');
            ctx.scale(dpr, dpr);

            var r = coverRect();
            ctx.save();
            ctx.translate(W, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, W - r.x - r.w, r.y, r.w, r.h);
            ctx.restore();

            var rect = lastRect;
            if (rect && typeof viewer.toDataURL === 'function') {
                try {
                    var img = new Image();
                    img.src = viewer.toDataURL('image/png');
                    await img.decode();
                    ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h);
                } catch (e) {
                    fieldLog('error', 'mascot capture failed: ' + (e && e.message));
                }
            }

            var url = out.toDataURL(PHOTO_MIME, PHOTO_QUALITY);
            fieldLog('photo', 'selfie capture ' + out.width + 'x' + out.height + ', ' +
                Math.round(url.length * 0.75 / 1024) + 'KB in ' + Math.round(performance.now() - t0) + 'ms' +
                (rect ? '' : ' (no mascot — no shoulders in view)'));
            document.getElementById('selfie-preview-img').src = url;
            document.getElementById('selfie-preview').classList.add('active');
        });

        // ─── PREVIEW ACTIONS ───
        function photoFile() {
            var dataUrl = document.getElementById('selfie-preview-img').src;
            var comma = dataUrl.indexOf(',');
            var mime = (dataUrl.slice(0, comma).match(/^data:([^;,]+)/) || [])[1] || PHOTO_MIME;
            var bin = atob(dataUrl.slice(comma + 1));
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new File([bytes], 'sharks-way-selfie.' + (mime === 'image/png' ? 'png' : 'jpg'), { type: mime });
        }

        document.getElementById('btn-retake').addEventListener('click', function () {
            document.getElementById('selfie-preview').classList.remove('active');
        });
        document.getElementById('btn-save').addEventListener('click', function () {
            var a = document.createElement('a');
            a.href = document.getElementById('selfie-preview-img').src;
            a.download = 'sharks-way-selfie-' + Date.now() + '.jpg';
            a.click();
            fieldLog('photo', 'saved (download)');
            document.getElementById('selfie-preview').classList.remove('active');
        });
        // Straight from the tap, no awaits first: Safari only allows share() then.
        document.getElementById('btn-share').addEventListener('click', function () {
            var file;
            try { file = photoFile(); } catch (e) { alert('Share failed — use Save'); return; }
            if (!navigator.share || (navigator.canShare && !navigator.canShare({ files: [file] }))) {
                fieldLog('photo', 'share not supported for files on this browser');
                alert('Sharing isn\'t supported in this browser — use Save.');
                return;
            }
            navigator.share({ files: [file], title: 'Sharks Way Selfie' })
                .then(function () { fieldLog('photo', 'shared'); })
                .catch(function (e) {
                    fieldLog('photo', 'share ended: ' + (e && e.name));
                    if (e && e.name !== 'AbortError') alert('Share failed — use Save.');
                });
        });

        // Menu: src/components/navigation.js wires the hamburger, close button and
        // overlay itself. (This page used to wire them here too, before they
        // existed — that threw, and stopped the map and GPS code below.)

        // ─── MAP ───
        var map = null;
        var userMarker = null;
        var userLat = null;
        var userLng = null;

        function initializeMap() {
            if (map || typeof L === 'undefined') return;
            var mapContainer = document.getElementById('mini-map');
            map = L.map(mapContainer, {
                zoomControl: false,
                attributionControl: true
            }).setView([37.3352, -121.8811], 13);

            // OSM tile policy: credit "OpenStreetMap contributors", no {s} subdomains.
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);
        }

        function updateMap() {
            if (!map || !userLat || !userLng || !window.updateMapMarkers) return;
            map.setView([userLat, userLng], 16);
            var isExpanded = document.getElementById('map-container').classList.contains('expanded');
            userMarker = window.updateMapMarkers(map, userLat, userLng, userMarker, isExpanded);
        }

        document.getElementById('toggle-map').addEventListener('click', function () {
            document.getElementById('map-container').classList.toggle('expanded');
            setTimeout(function () {
                if (map) {
                    map.invalidateSize();
                    updateMap();
                }
            }, 400);
        });

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                function (position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    if (!map) initializeMap();
                    updateMap();
                },
                function (error) {
                    fieldLog('gps', 'unavailable: ' + (error && error.message));
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
            );
        }

        setTimeout(initializeMap, 1000);
    </script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
