<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Full Shark AR (8th Wall)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    <link rel="stylesheet" href="./src/css/shared-styles.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/utils/checkpoint-loader.js"></script>
    <script type="module" src="./src/utils/shared-map-markers.js"></script>
    
    <!-- Core AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script type="module" src="./src/utils/shark-embedding-detector.js"></script>
    <script type="module" src="./src/utils/xr8-shark-video-bridge.js"></script>

    <!-- 1. 8th Wall Engine & Extras (2026 Distributed Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam" async></script>
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.5.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js" crossorigin="anonymous" async></script>
    
    <!-- A-Frame Extras for Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <!-- Project Source -->
    <script type="module" src="./src/utils/audio-utils.js"></script>
    <script type="module" src="./src/utils/math-utils.js"></script>
    <script type="module" src="./src/systems/event-system.js"></script>
    <script type="module" src="./src/components/shark-detector.js"></script>
    <script type="module" src="./src/components/shark-animator.js"></script>
    <script type="module" src="./src/components/tour-ui.js"></script>
    <script type="module" src="./src/components/soccer-game.js"></script>
    <script type="module" src="./src/components/net-shader.js"></script>
    <script type="module" src="./src/components/ball-shader.js"></script>
    <!-- Desktop sim (?desktop=1) must patch geolocation before anything reads it. -->
    <script type="module" src="./src/utils/desktop-sim.js"></script>
    <script type="module" src="./src/utils/geo-anchor.js"></script>
    <script type="module" src="./src/components/model-normalize.js"></script>
    <script type="module" src="./src/components/shark-motion.js"></script>
    <script type="module" src="./src/components/sun-follow.js"></script>
    <script type="module" src="./src/components/shared-gltf.js"></script>
    <script type="module" src="./src/components/sharks-way-modes.js"></script>
    <!-- Placement overrides must register before anything plants content. -->
    <script type="module" src="./src/utils/placement-overrides.js"></script>
    <script type="module" src="./src/components/location-experiences.js"></script>
    <!-- Debug placement HUD — inert unless ?debug=1 is in the URL. -->
    <script type="module" src="./src/components/debug-placement.js"></script>
    <script type="module" src="./src/app.js"></script>

    <link rel="stylesheet" href="./src/css/shark-ar-8thwall-styles.css" />
    <link rel="stylesheet" href="./src/css/debug-placement.css" />
</head>

<body>
    <!-- Top bar: back to dashboard + hamburger experience-switcher (injected by initNavigation).
         Photo Mode / Goalie Mode live under "Sharks Way Modes" in that menu (June 10 redline). -->
    <div id="topbar">
        <a href="./index.html" class="back" aria-label="Back to home">&larr;</a>
        <h1>Sharks Way — Shark AR</h1>
    </div>

    <button id="spawn-btn" onclick="if(window.manualSharkSpawn) window.manualSharkSpawn();">Summon a Shark</button>

    <!-- Tap Instruction Overlay. Sharks auto-appear along Sharks Way (no tap
         needed); once one is detected this updates to the "drop a shark" prompt. -->
    <div id="tap-instruction">Sharks appear automatically along Sharks Way — point your camera around</div>

    <!-- XRExtras will provide its own loading screen if xrextras-loading is used -->
    
    <!-- 8th Wall A-Frame scene -->
    <a-scene id="xrscene" 
        xrextras-almost-there
        xrextras-runtime-error
        xrextras-loading
        xrweb
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true;"
        tour-ui shark-detector="useGps: false; useVision: true" location-experiences>

        <a-assets>
            <!-- June 10 redline: Wayfinding cycle is Maria + Jimmy only. Stella,
                 Sharkie, and the Diving Shark were removed from this experience. -->
            <a-asset-item id="maria-swimmer" src="./assets/3D-models/SEAN_ANIMATED_WiTH_MARIA_SHARK.glb"></a-asset-item>
            <a-asset-item id="jimmy-swimmer" src="./assets/3D-models/jimmy-shark-swimmer.glb"></a-asset-item>
            <!-- Photo Mode mascots (place on ground; Flip Camera opens selfie-ar). -->
            <a-asset-item id="photo-sharkie" src="./assets/3D-models/sharkie_final_pose.glb"></a-asset-item>
            <a-asset-item id="photo-sammy" src="./assets/3D-models/sammy_final_pose.glb"></a-asset-item>
            <!-- Little Italy tap-to-place (Sept 28): one Athena + the tower. The
                 left-pointing Athena and Augustus belonged to the retired 8-statue
                 row; they're still spawnable from the debug MODELS tab. -->
            <a-asset-item id="athena-point-right" src="./assets/3D-models/Athena_Statue-point-right.glb"></a-asset-item>
            <a-asset-item id="leaning-tower-model" src="./assets/3D-models/Leaning_Tower_of_Pisa.glb"></a-asset-item>
            <!-- River jump + party jump. Carries its own baked breach; see dive-clip. -->
            <a-asset-item id="diving-shark" src="./assets/3D-models/maria-shark-jump-jimmy-txtr.glb"></a-asset-item>
            <!-- SAP party circle sharks. -->
            <a-asset-item id="circle-maria" src="./assets/3D-models/SEAN_ANIMATED_WiTH_MARIA_SHARK.glb"></a-asset-item>
            <a-asset-item id="circle-stella" src="./assets/3D-models/STELLA_CAI_SHARK_SJSU_TEST1.glb"></a-asset-item>
            <a-asset-item id="circle-jimmy" src="./assets/3D-models/jimmy-shark-swimmer.glb"></a-asset-item>
        </a-assets>

        <!-- Lighting for AR Shadows -->
        <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
        <a-entity light="type: directional; castShadow: true; intensity: 0.8; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowCameraTop: 20; shadowCameraBottom: -20; shadowCameraRight: 20; shadowCameraLeft: -20; shadowBias: -0.0005; target: #camera" position="5 10 5" sun-follow></a-entity>

        <!-- Shadow Ground Plane (Clickable for spawning) -->
        <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="1000" height="1000" material="shader: shadow; opacity: 0.4;" shadow="receive: true"></a-plane>

        <!-- Shark Content (Wayfinding) -->
        <a-entity id="shark-root" position="0 0 0" visible="false" shark-animator>
        </a-entity>

        <!-- Photo Mode mascot root -->
        <a-entity id="photo-root" position="0 0 0" visible="false"></a-entity>

        <!-- Goalie Mode (hockey puck; input gated by SharksWayMode) -->
        <a-entity id="soccer-root" position="0 0 0" soccer-game="usePuck: true"></a-entity>

        <a-camera id="camera" position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // Start logic - 8th Wall components on a-scene will handle run()
        window.addEventListener('xrloaded', () => {
            console.log('8th Wall Engine Loaded');
        });
    </script>

    <!-- GPS Tracking -->
    <script type="module" src="./src/utils/shared-gps-tracking.js"></script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
