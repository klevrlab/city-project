<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Sharks Way - Shark Painting Demo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./src/css/map-component.css" />
    <link rel="stylesheet" href="./src/css/progress-tracker.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./src/utils/checkpoint-loader.js"></script>
    <script type="module" src="./src/utils/shared-map-markers.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script type="module" src="./src/utils/shark-embedding-detector.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/three@0.126.0/examples/js/loaders/GLTFLoader.js"></script>
    <link rel="stylesheet" href="./src/css/sharks-way-v0-styles.css" />
    <link rel="stylesheet" href="./src/css/navigation.css" />
</head>

<body>
    <!-- Camera feed -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="debug-canvas" width="224" height="224"></canvas>

    <!-- Loading overlay -->
    <div id="loading">
        <div class="spinner"></div>
        <h2>Sharks Way</h2>
        <p>Getting everything ready...</p>
        <div id="loading-status">Please wait</div>
    </div>

    <!-- Top bar -->
    <div id="topbar">
        <a href="./index.html" class="back">&larr;</a>
        <h1>Sharks Way</h1>
        
    </div>

    <!-- Navigation Menu -->
    <div id="sharkey-message"
            style="font-size: 12px; margin-top: 8px; color: rgba(255,255,255,0.8); line-height: 1.5;"></div>
        <button class="cta-button" id="learn-more">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <rect x="2" y="7" width="20" height="15" rx="2" ry="2" />
                <path d="M17 2 12 7 7 2" />
            </svg>
            Learn More
        </button>
        <button class="cta-button" id="dismiss-event"
            style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); margin-top: 6px;">
            Dismiss
        </button>
    </div>

    <!-- Progress tracker -->
    <div id="progress-tracker">
        <div style="font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                style="width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none;">
                <!-- <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg> -->
                Checkpoints
        </div>
        <div class="stop-item" data-checkpoint="A" id="checkpoint-a">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            Loading...
        </div>
        <div class="stop-item" data-checkpoint="B" id="checkpoint-b">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            Loading...
        </div>
        <!-- <div class="gps-status" id="gps-status">GPS: Waiting...</div> -->
    </div>

    <!-- Map Component -->
    <div id="map-container">
        <button id="toggle-map" aria-label="Open map">
            <!--
                Map FAB icon: a clean folded-map + location pin drawn in white/teal
                Visible at 26×26px, crisp on dark backgrounds
            -->
            <svg class="map-fab-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- map sheet left fold -->
                <polygon points="2,5 9,3 9,21 2,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <!-- map sheet middle -->
                <polygon points="9,3 17,5 17,23 9,21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.55)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <!-- map sheet right fold -->
                <polygon points="17,5 24,3 24,21 17,23" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.7)"
                    stroke-width="1.2" stroke-linejoin="round" />
                <!-- route line on map -->
                <path d="M5 14 Q7 10 9 12 Q11 14 13 10" stroke="#00A9E0" stroke-width="1.3" stroke-linecap="round"
                    stroke-linejoin="round" fill="none" />
                <!-- pin body -->
                <path
                    d="M19 4.5 C17.07 4.5 15.5 6.07 15.5 8 C15.5 10.5 19 14.5 19 14.5 C19 14.5 22.5 10.5 22.5 8 C22.5 6.07 20.93 4.5 19 4.5Z"
                    fill="#00A9E0" stroke="rgba(0,18,24,0.4)" stroke-width="0.8" />
                <!-- pin inner dot -->
                <circle cx="19" cy="8" r="1.6" fill="rgba(0,18,24,0.55)" />
            </svg>
            <!-- Close icon (shown when expanded) -->
            <span class="map-icon-close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </span>
        </button>
        <div id="mini-map"></div>
    </div>

    <!-- Shark animation + video plane (fallback mode) -->
    <div id="shark-plane-overlay">
        <a-scene id="mural-shark-scene" embedded vr-mode-ui="enabled: false"
            renderer="alpha: true; antialias: true; colorManagement: true;" shadow="type: pcfsoft">
            <a-assets>
                <video id="videoTexture" src="./assets/video.mp4" autoplay loop muted playsinline
                    crossorigin="anonymous" preload="auto"></video>
                <a-asset-item id="sharkModel1" src="./assets/3D-models/STELLA_CAI_SHARK_SJSU_TEST1.glb"></a-asset-item>
                <a-asset-item id="sharkModel2" src="./assets/3D-models/SHAUN_SHARK_ANIMATED.glb"></a-asset-item>
            </a-assets>
            <a-entity id="mural-shark-root" mural-shark-content></a-entity>
            <a-entity camera="fov: 55; zoom: 1.0" position="0 1.35 3.1" look-controls="enabled: false"></a-entity>
            <a-entity light="type: ambient; intensity: 0.9; color: #ffffff"></a-entity>
            <a-entity
                light="type: directional; intensity: 1.1; color: #ffffff; castShadow: true; shadowMapWidth: 1024; shadowMapHeight: 1024; shadowCameraLeft: -12; shadowCameraRight: 12; shadowCameraTop: 12; shadowCameraBottom: -12; shadowCameraNear: 0.5; shadowCameraFar: 30; shadowBias: -0.0001"
                position="2 4 2"></a-entity>
            <a-plane id="shadow-ground" position="0 -2 0" rotation="-90 0 0" width="24" height="24"
                material="color: #1a1a1a; transparent: true; opacity: 0.5; depthWrite: false"
                shadow="cast: false; receive: true"></a-plane>
        </a-scene>
    </div>

    <script>
        const SEARCH_PARAMS = new URLSearchParams(window.location.search || '');
        const CAVEMAN_DEBUG = false;
        const CAVEMAN_FREEZE = false;
        const CAVEMAN_RIG0_TUNER = false;
        const CAVEMAN_TUNER_RIG_INDEX = 1;

        function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
        function getResponsiveScale() {
            const minDim = Math.min(window.innerWidth || 0, window.innerHeight || 0);
            if (minDim <= 420) return 0.6;
            if (minDim <= 720) return 0.8;
            return 1.0;
        }
        function applyVideoPlaneLayout(opts) {
            const { videoEl, planeEl, shadowEl } = opts || {};
            if (!planeEl) return;
            const scale = getResponsiveScale();
            const baseHeight = 1.0 * scale;
            const aspect = (videoEl && videoEl.videoWidth && videoEl.videoHeight)
                ? (videoEl.videoWidth / videoEl.videoHeight) : 1;
            const width = clamp(baseHeight * aspect, 0.9 * scale, 1.6 * scale);
            const posX = 0.85 * scale, posZ = -0.85 * scale, videoY = 0.12 * scale;
            const shadowY = 0.01, shadowPad = 0.18 * scale;
            planeEl.setAttribute('position', `${posX} ${videoY} ${posZ}`);
            planeEl.setAttribute('width', width);
            planeEl.setAttribute('height', baseHeight);
            if (shadowEl) {
                shadowEl.setAttribute('position', `${posX} ${shadowY} ${posZ}`);
                shadowEl.setAttribute('width', width + shadowPad);
                shadowEl.setAttribute('height', baseHeight + shadowPad);
            }
        }

        if (typeof AFRAME !== 'undefined') {
            AFRAME.registerComponent('video-fact-cycle', {
                schema: {
                    intervalMs: { type: 'number', default: 8000 },
                    visibleMs: { type: 'number', default: 4000 },
                    animMs: { type: 'number', default: 500 },
                    videoId: { type: 'string', default: 'videoTexture' },
                    shadowSelector: { type: 'string', default: '.video-shadow' }
                },
                init: function () {
                    this._timer = null;
                    this._cycle = this._cycle.bind(this);
                    this.shadowEl = this.el.parentElement && this.data.shadowSelector
                        ? this.el.parentElement.querySelector(this.data.shadowSelector) : null;
                },
                playOnce: function () { this._cycle(); },
                stop: function () {
                    if (this._timer) { clearInterval(this._timer); this._timer = null; }
                    this.el.removeAttribute('animation__factIn');
                    this.el.removeAttribute('animation__factOut');
                    this.el.setAttribute('scale', '0.001 0.001 0.001');
                    if (this.shadowEl) {
                        this.shadowEl.removeAttribute('animation__shadowIn');
                        this.shadowEl.removeAttribute('animation__shadowOut');
                        this.shadowEl.setAttribute('scale', '0.001 0.001 0.001');
                    }
                    const videoEl = document.getElementById(this.data.videoId);
                    if (videoEl) videoEl.pause();
                },
                _cycle: function () {
                    const videoEl = document.getElementById(this.data.videoId);
                    if (videoEl) {
                        const duration = Number.isFinite(videoEl.duration) ? videoEl.duration : 0;
                        if (duration > 4) {
                            const maxStart = Math.max(duration - 4, 0.1);
                            videoEl.currentTime = Math.random() * maxStart;
                        }
                        videoEl.play().catch(function () { });
                    }
                    this.el.setAttribute('scale', '0.001 0.001 0.001');
                    this.el.setAttribute('animation__factIn', {
                        property: 'scale', from: '0.001 0.001 0.001', to: '1 1 1',
                        dur: this.data.animMs, easing: 'easeOutBack'
                    });
                    if (this.shadowEl) {
                        this.shadowEl.setAttribute('scale', '0.001 0.001 0.001');
                        this.shadowEl.setAttribute('animation__shadowIn', {
                            property: 'scale', from: '0.001 0.001 0.001', to: '1 1 1',
                            dur: this.data.animMs, easing: 'easeOutBack'
                        });
                    }
                    const self = this;
                    setTimeout(function () {
                        self.el.setAttribute('animation__factOut', {
                            property: 'scale', from: '1 1 1', to: '0.001 0.001 0.001',
                            dur: self.data.animMs, easing: 'easeInCubic'
                        });
                        if (self.shadowEl) {
                            self.shadowEl.setAttribute('animation__shadowOut', {
                                property: 'scale', from: '1 1 1', to: '0.001 0.001 0.001',
                                dur: self.data.animMs, easing: 'easeInCubic'
                            });
                        }
                        if (videoEl) videoEl.pause();
                    }, this.data.visibleMs);
                }
            });

            AFRAME.registerComponent('mural-shark-content', {
                init: function () {
                    const self = this;
                    self.root = self.el;
                    self.cyclingActive = false;
                    self.currentSharkIndex = 0;
                    self.sharkTimers = [];
                    self.modelDebug = [{ loaded: false, mesh: false, size: '-' }, { loaded: false, mesh: false, size: '-' }];
                    self.debugEl = document.getElementById('caveman-debug');
                    self.debugText = '';
                    self.root.innerHTML = [
                        '<a-plane class="video-shadow" visible="false" position="0.85 0.01 -0.85" rotation="-90 0 0" width="1.2" height="1.2" material="color: #000000; opacity: 0.22; transparent: true; depthWrite: false"></a-plane>',
                        '<a-plane class="shark-video-plane" visible="false" position="0.85 0.05 -0.85" rotation="-90 0 0" width="1.0" height="1.0" material="shader: flat; src: #videoTexture; transparent: true; color: #000000"></a-plane>',
                        '<a-entity class="shark-rig-1" visible="false" position="0 1.0 0" rotation="0 0 0" scale="0.55 0.55 0.55">',
                        '  <a-box class="debug-proxy" visible="false" depth="0.8" height="0.35" width="1.6" material="color: #ff00ff; opacity: 0.95"></a-box>',
                        '  <a-entity class="shark-model-1" gltf-model="#sharkModel1" position="0 -0.85 0" rotation="0 0 0" animation-mixer="loop: repeat; timeScale: 1.0" shadow="cast: true; receive: false"></a-entity>',
                        '</a-entity>',
                        '<a-entity class="shark-rig-2" visible="false" position="0 1.0 0" rotation="0 0 0" scale="0.55 0.55 0.55">',
                        '  <a-box class="debug-proxy" visible="false" depth="0.8" height="0.35" width="1.6" material="color: #00ff00; opacity: 0.95"></a-box>',
                        '  <a-entity class="shark-model-2" gltf-model="#sharkModel2" position="0 -0.85 0" rotation="0 180 0" animation-mixer="loop: repeat; timeScale: 1.0" shadow="cast: true; receive: false"></a-entity>',
                        '</a-entity>'
                    ].join('');
                    self.sharkVideoPlane = self.root.querySelector('.shark-video-plane');
                    self.sharkVideoShadow = self.root.querySelector('.video-shadow');
                    if (self.sharkVideoPlane) {
                        self.sharkVideoPlane.setAttribute('video-fact-cycle', 'intervalMs: 8000; visibleMs: 4000; animMs: 500; videoId: videoTexture');
                    }
                    self.sharkRigs = [self.root.querySelector('.shark-rig-1'), self.root.querySelector('.shark-rig-2')];
                    self.sharkModels = [self.root.querySelector('.shark-model-1'), self.root.querySelector('.shark-model-2')];
                    self.debugProxies = Array.from(self.root.querySelectorAll('.debug-proxy'));
                    if (CAVEMAN_DEBUG) {
                        (self.debugProxies || []).forEach(function (proxy) { proxy.setAttribute('visible', true); });
                        (self.sharkRigs || []).forEach(function (rig) {
                            if (!rig || !rig.object3D || typeof THREE === 'undefined') return;
                            if (rig.object3D.getObjectByName('debug-axes')) return;
                            var axes = new THREE.AxesHelper(0.8);
                            axes.name = 'debug-axes';
                            rig.object3D.add(axes);
                        });
                        if (self.debugEl) self.debugEl.hidden = false;
                    }
                    self.updateDebug = function (extra) {
                        if (!CAVEMAN_DEBUG || !self.debugEl) return;
                        var r0 = (self.sharkRigs && self.sharkRigs[0]) ? self.sharkRigs[0].getAttribute('position') : null;
                        var r1 = (self.sharkRigs && self.sharkRigs[1]) ? self.sharkRigs[1].getAttribute('position') : null;
                        var lines = [
                            'CAVEMAN DEBUG ON',
                            'cycling=' + self.cyclingActive + ' idx=' + self.currentSharkIndex,
                            'rig0 vis=' + !!(self.sharkRigs && self.sharkRigs[0] && self.sharkRigs[0].getAttribute('visible')) + ' pos=' + (r0 ? `${r0.x.toFixed(2)},${r0.y.toFixed(2)},${r0.z.toFixed(2)}` : '-'),
                            'rig1 vis=' + !!(self.sharkRigs && self.sharkRigs[1] && self.sharkRigs[1].getAttribute('visible')) + ' pos=' + (r1 ? `${r1.x.toFixed(2)},${r1.y.toFixed(2)},${r1.z.toFixed(2)}` : '-'),
                            `m1 loaded=${self.modelDebug[0].loaded} mesh=${self.modelDebug[0].mesh} bbox=${self.modelDebug[0].size}`,
                            `m2 loaded=${self.modelDebug[1].loaded} mesh=${self.modelDebug[1].mesh} bbox=${self.modelDebug[1].size}`,
                            extra || ''
                        ];
                        self.debugEl.textContent = lines.filter(Boolean).join('\n');
                    };
                    self.sharkModels.forEach(function (modelEl, idx) {
                        if (!modelEl) return;
                        modelEl.addEventListener('model-loaded', function () {
                            var mesh = modelEl.getObject3D('mesh');
                            self.modelDebug[idx].loaded = true;
                            self.modelDebug[idx].mesh = !!mesh;
                            if (mesh && typeof THREE !== 'undefined') {
                                try {
                                    var box = new THREE.Box3().setFromObject(mesh);
                                    var size = new THREE.Vector3();
                                    box.getSize(size);
                                    self.modelDebug[idx].size = `${size.x.toFixed(2)}x${size.y.toFixed(2)}x${size.z.toFixed(2)}`;

                                    // Recenter model around rig origin once so rig coords are meaningful.
                                    if (!modelEl.dataset.centered) {
                                        var center = new THREE.Vector3();
                                        box.getCenter(center);
                                        var basePos = modelEl.getAttribute('position') || { x: 0, y: 0, z: 0 };
                                        var px = Number(basePos.x || 0) - center.x;
                                        var py = Number(basePos.y || 0) - center.y;
                                        var pz = Number(basePos.z || 0) - center.z;
                                        modelEl.setAttribute('position', `${px} ${py} ${pz}`);
                                        modelEl.dataset.centered = 'true';
                                    }
                                } catch (e) {
                                    self.modelDebug[idx].size = 'bbox_err';
                                }
                            }
                            console.log('[CAVEMAN] model-loaded', idx, self.modelDebug[idx]);
                            self.updateDebug('model-loaded ' + idx);
                        });
                        modelEl.addEventListener('model-error', function (e) {
                            self.modelDebug[idx].loaded = false;
                            self.modelDebug[idx].mesh = false;
                            self.modelDebug[idx].size = 'load_err';
                            console.warn('[CAVEMAN] model-error', idx, e && e.detail);
                            self.updateDebug('model-error ' + idx);
                        });
                    });
                    self.updateVideoLayout = function () {
                        applyVideoPlaneLayout({
                            videoEl: document.getElementById('videoTexture'),
                            planeEl: self.sharkVideoPlane,
                            shadowEl: self.sharkVideoShadow
                        });
                    };
                    self.updateVideoLayout();
                    window.addEventListener('resize', self.updateVideoLayout);
                    self.updateDebug('init');
                },
                show: function () {
                    var self = this;
                    if (CAVEMAN_DEBUG && CAVEMAN_RIG0_TUNER) {
                        if (self.sharkVideoPlane) self.sharkVideoPlane.setAttribute('visible', false);
                        if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', false);
                        (self.sharkRigs || []).forEach(function (rig) {
                            if (!rig) return;
                            rig.removeAttribute('animation__swimPass');
                            rig.removeAttribute('animation__swimIn');
                            rig.removeAttribute('animation__swimOut');
                            rig.removeAttribute('animation__bob');
                            rig.setAttribute('visible', false);
                        });
                        self.cyclingActive = false;
                        var rigIndex = CAVEMAN_TUNER_RIG_INDEX;
                        var rig = (self.sharkRigs || [])[rigIndex];
                        if (rig) {
                            if (self.rigTunerHideTimer) clearTimeout(self.rigTunerHideTimer);
                            rig.setAttribute('visible', true);
                            rig.setAttribute('rotation', rigIndex === 0 ? '0 0 0' : '0 0 0');
                            rig.setAttribute('scale', '0.85 0.85 0.85');
                            rig.setAttribute('position', `${RIG0_TUNER.x.toFixed(2)} ${RIG0_TUNER.y.toFixed(2)} 2.50`);
                            rig.setAttribute('animation__swimPass', {
                                property: 'position',
                                from: `${RIG0_TUNER.x.toFixed(2)} ${RIG0_TUNER.y.toFixed(2)} 2.50`,
                                to: `${RIG0_TUNER.x.toFixed(2)} ${RIG0_TUNER.y.toFixed(2)} -15.00`,
                                dur: 3600,
                                easing: 'easeInOutSine'
                            });
                            var model0 = (self.sharkModels || [])[rigIndex];
                            if (model0) {
                                var mesh0 = model0.getObject3D('mesh');
                                if (mesh0) {
                                    mesh0.traverse(function (child) {
                                        if (!child.isMesh || !child.material) return;
                                        var mats = Array.isArray(child.material) ? child.material : [child.material];
                                        mats.forEach(function (mat) {
                                            mat.transparent = true;
                                            mat.opacity = 1.0;
                                            mat.needsUpdate = true;
                                        });
                                    });
                                }
                            }
                            setTimeout(function () {
                                var modelAtFade = (self.sharkModels || [])[rigIndex];
                                if (!modelAtFade) return;
                                var meshAtFade = modelAtFade.getObject3D('mesh');
                                if (!meshAtFade) return;
                                var fadeStart = performance.now();
                                var fadeDuration = 650;
                                function fadeStep(now) {
                                    var t = Math.min((now - fadeStart) / fadeDuration, 1);
                                    var opacity = 1 - t;
                                    meshAtFade.traverse(function (child) {
                                        if (!child.isMesh || !child.material) return;
                                        var mats = Array.isArray(child.material) ? child.material : [child.material];
                                        mats.forEach(function (mat) {
                                            mat.transparent = true;
                                            mat.opacity = opacity;
                                            mat.needsUpdate = true;
                                        });
                                    });
                                    if (t < 1) requestAnimationFrame(fadeStep);
                                }
                                requestAnimationFrame(fadeStep);
                            }, 3400);
                            self.rigTunerHideTimer = setTimeout(function () {
                                rig.removeAttribute('animation__swimPass');
                                rig.setAttribute('visible', false);
                                var modelAtHide = (self.sharkModels || [])[rigIndex];
                                if (modelAtHide) {
                                    var meshAtHide = modelAtHide.getObject3D('mesh');
                                    if (meshAtHide) {
                                        meshAtHide.traverse(function (child) {
                                            if (!child.isMesh || !child.material) return;
                                            var mats = Array.isArray(child.material) ? child.material : [child.material];
                                            mats.forEach(function (mat) {
                                                mat.transparent = true;
                                                mat.opacity = 1.0;
                                                mat.needsUpdate = true;
                                            });
                                        });
                                    }
                                }
                            }, 4100);
                        }
                        self.updateDebug('show: rig' + rigIndex + ' tuner mode');
                        return;
                    }
                    if (CAVEMAN_DEBUG && CAVEMAN_FREEZE) {
                        if (self.sharkVideoPlane) self.sharkVideoPlane.setAttribute('visible', false);
                        if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', false);
                        (self.sharkRigs || []).forEach(function (rig, i) {
                            if (!rig) return;
                            rig.removeAttribute('animation__swimPass');
                            rig.removeAttribute('animation__swimIn');
                            rig.removeAttribute('animation__swimOut');
                            rig.removeAttribute('animation__bob');
                            if (i === 0) {
                                rig.setAttribute('visible', true);
                                rig.setAttribute('position', '0 0 -1');
                                rig.setAttribute('scale', '2 2 2');
                            } else {
                                rig.setAttribute('visible', false);
                            }
                        });
                        self.cyclingActive = false;
                        self.updateDebug('show: freeze rig0 center');
                        return;
                    }
                    if (self.sharkVideoPlane) {
                        var videoEl = document.getElementById('videoTexture');
                        var showPlane = function () {
                            self.sharkVideoPlane.setAttribute('visible', true);
                            if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', true);
                            var cycle = self.sharkVideoPlane.components['video-fact-cycle'];
                            if (cycle) cycle.playOnce();
                        };
                        var hidePlane = function () {
                            self.sharkVideoPlane.setAttribute('visible', false);
                            if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', false);
                        };

                        if (videoEl) {
                            if (videoEl.readyState >= 2) {
                                showPlane();
                            } else {
                                hidePlane();
                                videoEl.addEventListener('loadeddata', showPlane, { once: true });
                            }
                            var playPromise = videoEl.play();
                            if (playPromise && typeof playPromise.catch === 'function') {
                                playPromise.catch(function () {
                                    hidePlane();
                                });
                            }
                        } else {
                            hidePlane();
                        }
                    }
                    if (self.cyclingActive) return;
                    self.cyclingActive = true;
                    self.currentSharkIndex = 0;
                    self.animateNextShark();
                    self.updateDebug('show: cycling start');
                },
                hide: function () {
                    var self = this;
                    self.cyclingActive = false;
                    (self.sharkTimers || []).forEach(function (t) { if (t) clearTimeout(t); });
                    self.sharkTimers = [];
                    (self.sharkRigs || []).forEach(function (rig) {
                        if (!rig) return;
                        rig.removeAttribute('animation__swimPass');
                        rig.removeAttribute('animation__swimIn');
                        rig.removeAttribute('animation__swimOut');
                        rig.removeAttribute('animation__bob');
                        rig.setAttribute('visible', false);
                    });
                    (self.sharkModels || []).forEach(function (modelEl) {
                        if (!modelEl) return;
                        modelEl.removeAttribute('animation__bobModel');
                    });
                    if (self.sharkVideoPlane) {
                        self.sharkVideoPlane.setAttribute('visible', false);
                        if (self.sharkVideoShadow) self.sharkVideoShadow.setAttribute('visible', false);
                        var cycle = self.sharkVideoPlane.components['video-fact-cycle'];
                        if (cycle) cycle.stop();
                    }
                    self.updateDebug('hide');
                },
                animateNextShark: function () {
                    var self = this;
                    if (!self.cyclingActive) return;
                    var sharkIndex = self.currentSharkIndex % 2;
                    var rig = (self.sharkRigs || [])[sharkIndex];
                    var modelEl = (self.sharkModels || [])[sharkIndex];
                    if (!rig) return;

                    // Start a bit further away, glide into the center,
                    // chill there briefly, then swim off into the distance.
                    var startY = sharkIndex === 0 ? 0.82 : 0.72;
                    var startZ = 8.0;
                    var centerZ = -2;
                    var endZ = -8.0;

                    var swimInDuration = 1800;
                    var chillDuration = 3200;
                    var swimOutDuration = 2400;
                    var totalDuration = swimInDuration + chillDuration + swimOutDuration;

                    rig.setAttribute('visible', true);
                    rig.setAttribute('rotation', sharkIndex === 0 ? '0 0 0' : '0 0 0');
                    rig.setAttribute('position', `0 ${startY} ${startZ}`);
                    rig.removeAttribute('animation__swimPass');
                    rig.removeAttribute('animation__swimIn');
                    rig.removeAttribute('animation__swimOut');

                    if (modelEl) {
                        var modelPos = modelEl.getAttribute('position') || { x: 0, y: 0, z: 0 };
                        var mx = Number(modelPos.x || 0);
                        var my = Number(modelPos.y || 0);
                        var mz = Number(modelPos.z || 0);
                        modelEl.setAttribute('animation__bobModel', {
                            property: 'position',
                            from: `${mx.toFixed(3)} ${(my - 0.08).toFixed(3)} ${mz.toFixed(3)}`,
                            to: `${mx.toFixed(3)} ${(my + 0.08).toFixed(3)} ${mz.toFixed(3)}`,
                            dir: 'alternate',
                            dur: 520,
                            easing: 'easeInOutSine',
                            loop: true
                        });
                        var mesh = modelEl.getObject3D('mesh');
                        if (mesh) {
                            mesh.traverse(function (child) {
                                if (!child.isMesh || !child.material) return;
                                var mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(function (mat) {
                                    mat.transparent = true;
                                    mat.opacity = 1.0;
                                    mat.needsUpdate = true;
                                });
                            });
                        }
                    }

                    rig.setAttribute('animation__swimIn', {
                        property: 'position',
                        from: `0 ${startY} ${startZ}`,
                        to: `0 ${startY} ${centerZ}`,
                        dur: swimInDuration,
                        easing: 'easeOutSine'
                    });

                    var swimOutTimer = setTimeout(function () {
                        if (!self.cyclingActive) return;
                        rig.setAttribute('animation__swimOut', {
                            property: 'position',
                            from: `0 ${startY} ${centerZ}`,
                            to: `0 ${startY} ${endZ}`,
                            dur: swimOutDuration,
                            easing: 'easeInSine'
                        });
                    }, swimInDuration + chillDuration);
                    self.sharkTimers.push(swimOutTimer);

                    var fadeDuration = 620;
                    var fadeLeadMs = 700;
                    var fadeDelay = Math.max(totalDuration - fadeLeadMs, 0);
                    var fadeTimer = setTimeout(function () {
                        if (!self.cyclingActive || !modelEl) return;
                        var fadeMesh = modelEl.getObject3D('mesh');
                        if (!fadeMesh) return;
                        var fadeStart = performance.now();
                        function fadeStep(now) {
                            if (!self.cyclingActive) return;
                            var t = Math.min((now - fadeStart) / fadeDuration, 1);
                            var opacity = 1 - t;
                            fadeMesh.traverse(function (child) {
                                if (!child.isMesh || !child.material) return;
                                var mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(function (mat) {
                                    mat.transparent = true;
                                    mat.opacity = opacity;
                                    mat.needsUpdate = true;
                                });
                            });
                            if (t < 1) requestAnimationFrame(fadeStep);
                        }
                        requestAnimationFrame(fadeStep);
                    }, fadeDelay);
                    self.sharkTimers.push(fadeTimer);

                    var hideTimer = setTimeout(function () {
                        rig.removeAttribute('animation__swimIn');
                        rig.removeAttribute('animation__swimOut');
                        rig.setAttribute('visible', false);
                        if (modelEl) {
                            modelEl.removeAttribute('animation__bobModel');
                            var meshAtHide = modelEl.getObject3D('mesh');
                            if (meshAtHide) {
                                meshAtHide.traverse(function (child) {
                                    if (!child.isMesh || !child.material) return;
                                    var mats = Array.isArray(child.material) ? child.material : [child.material];
                                    mats.forEach(function (mat) {
                                        mat.transparent = true;
                                        mat.opacity = 1.0;
                                        mat.needsUpdate = true;
                                    });
                                });
                            }
                        }
                        self.currentSharkIndex = (self.currentSharkIndex + 1) % 2;
                        if (self.cyclingActive) {
                            var nextTimer = setTimeout(function () {
                                self.animateNextShark();
                            }, 220);
                            self.sharkTimers.push(nextTimer);
                        }
                    }, totalDuration + 40);
                    self.sharkTimers.push(hideTimer);
                    self.updateDebug('animate idx=' + sharkIndex);
                },
                remove: function () {
                    this.hide();
                    if (this.updateVideoLayout) window.removeEventListener('resize', this.updateVideoLayout);
                }
            });
        }

        // Determine checkpoint status based on simple longitude check
        // "left of both check both, left of one check one, left of none check none"
        function evaluateCheckpoints(position) {
            const { latitude, longitude, accuracy } = position.coords;

            addGPSLog(`Position: ${latitude.toFixed(6)}, ${longitude.toFixed(6)} (±${accuracy.toFixed(1)}m)`);

            let checkedCount = 0;
            let status = '';

            // Check if user's longitude is "left of" (less than or equal to) the checkpoint's longitude
            if (longitude <= CHECKPOINTS.A.lng) {
                if (!STATE.checkpointA.visited) {
                    addGPSLog(`✓ Passed Checkpoint A`, 'checkpoint');
                }
                STATE.checkpointA.visited = true;
                checkedCount++;
            } else {
                STATE.checkpointA.visited = false;
            }

            if (longitude <= CHECKPOINTS.B.lng) {
                if (!STATE.checkpointB.visited) {
                    addGPSLog(`✓ Passed Checkpoint B`, 'checkpoint');
                }
                STATE.checkpointB.visited = true;
                checkedCount++;
            } else {
                STATE.checkpointB.visited = false;
            }

            // Set active state for UI and descriptive status
            if (STATE.checkpointA.visited && STATE.checkpointB.visited) {
                STATE.checkpointA.active = false;
                STATE.checkpointB.active = true;
                status = 'Left of both (checked both)';
            } else if (STATE.checkpointA.visited) {
                STATE.checkpointA.active = false;
                STATE.checkpointB.active = true;
                status = 'Left of one (checked A)';
            } else {
                STATE.checkpointA.active = true;
                STATE.checkpointB.active = false;
                status = 'Right of both (none checked)';
            }

            // Update GPS status display
            const gpsStatus = document.getElementById('gps-status');
            if (gpsStatus) {
                gpsStatus.textContent = `GPS: Longitude ${longitude.toFixed(5)} - ${status}`;
            }

            // Update UI
            updateCheckpointUI();
        }

        // Handle GPS errors

            let errorMsg = '';
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    errorMsg = 'GPS permission denied';
                    break;
                case error.POSITION_UNAVAILABLE:
                    errorMsg = 'GPS position unavailable';
                    break;
                case error.TIMEOUT:
                    errorMsg = 'GPS request timeout';
                    break;
                default:
                    errorMsg = 'GPS unknown error';
                    break;
            }

            addGPSLog(errorMsg, 'error');

            const gpsStatus = document.getElementById('gps-status');
            if (gpsStatus) {
                gpsStatus.textContent = `GPS: ${errorMsg}`;
            }
        }

        // ─── SOUND ───
        function playSound(type) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                if (type === 'found') {
                    oscillator.frequency.value = 800;
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.3);
                } else if (type === 'tap') {
                    oscillator.frequency.value = 1200;
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                }
            } catch (e) { /* ignore audio errors */ }
        }

                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            ui.video.srcObject = STATE.stream;
            await new Promise(r => { ui.video.onloadedmetadata = r; });
        }

        async function getFrameEmbedding() {
            return SharkEmbeddingDetector.getFrameEmbedding(STATE.model, ui.video, ui.debugCanvas);
        }

        // ─── SHARK FOUND / LOST ───
        function onSharkFound(name, score) {
            if (STATE.sharkVisible) return; // already showing
            STATE.sharkVisible = true;
            STATE.lastMatchTime = performance.now();

            // Always use the A-Frame fallback sharks overlay.
            showFallbackSharks();
            showBasketballPromo();
            // Show label
            ui.labelName.textContent = 'Follow Sharkie';
            ui.sharkLabel.classList.add('visible');

            // Show event info + sound
            showEvent(dummyEvents[STATE.currentEventIndex]);
            playSound('found');

        }

        function onSharkLost() {
            // Do nothing — shark stays until user dismisses
        }

        function dismissAll() {
            STATE.sharkVisible = false;
            STATE.dismissedAt = performance.now();
            STATE.recentScores = [];
            if (STATE.bannerDismissTimer) {
                clearTimeout(STATE.bannerDismissTimer);
                STATE.bannerDismissTimer = null;
            }
            ui.sharkLabel.classList.remove('visible');
            hideFallbackSharks();
            hideBasketballPromo();
            hideEvent();
        }

        // ─── GPS FALLBACK ───
        function haversineMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function updateGpsStatusText() {
            if (!ui.gpsStatus) return;
            if (STATE.gpsDistanceM == null) {
                ui.gpsStatus.textContent = 'GPS: waiting…';
                return;
            }
            const d = STATE.gpsDistanceM;
            const distText = d >= 1000 ? `${(d / 1000).toFixed(2)}km` : `${Math.round(d)}m`;
            ui.gpsStatus.textContent = `GPS: ${distText} from Sharks Way`;
        }

        function startGpsWatch() {
            if (!('geolocation' in navigator)) {
                if (ui.gpsStatus) ui.gpsStatus.textContent = 'GPS: unavailable';
                return;
            }

            try {
                if (STATE.gpsWatchId != null) navigator.geolocation.clearWatch(STATE.gpsWatchId);
            } catch (e) { /* ignore */ }

            STATE.gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const d = haversineMeters(lat, lng, GPS_TARGET.lat, GPS_TARGET.lng);
                    STATE.gpsDistanceM = d;
                    const inRange = d <= GPS_RADIUS_M;

                    // If user is close, force the "found" state even if ML can't see the mural (night/low light).
                    STATE.gpsActive = inRange;
                    updateGpsStatusText();

                    const cooldownOver = performance.now() - STATE.dismissedAt > 3000;
                    if (inRange && cooldownOver && !STATE.sharkVisible) {
                        onSharkFound('gps', 1.0);
                    }
                },
                (err) => {
                    console.warn('GPS error:', err);
                    STATE.gpsDistanceM = null;
                    STATE.gpsActive = false;
                    if (ui.gpsStatus) ui.gpsStatus.textContent = 'GPS: blocked';
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
            );
        }

        // ─── MAIN LOOP ───
        async function loop() {
            if (!STATE.running) return;

            try {
                if (!STATE.model || !STATE.stream || STATE.enrolled.length === 0) {
                    requestAnimationFrame(loop);
                    return;
                }

                const embedding = await getFrameEmbedding();
                if (!embedding) {
                    requestAnimationFrame(loop);
                    return;
                }
                const rawMatch = SharkEmbeddingDetector.bestMatch(STATE, embedding);
                const smoothed = SharkEmbeddingDetector.rollingScore(STATE, rawMatch);

                const cooldownOver = performance.now() - STATE.dismissedAt > 3000;
                const mlMatch = cooldownOver && smoothed.name && smoothed.score >= THRESHOLD && smoothed.confidence >= 0.4;
                const gpsMatch = cooldownOver && STATE.gpsActive;

                if (mlMatch || gpsMatch) {
                    STATE.lastMatchTime = performance.now();
                    onSharkFound(smoothed.name, smoothed.score);
                } else {
                    onSharkLost();
                }
            } catch (e) {
                console.error('Loop error:', e);
            }

            requestAnimationFrame(loop);
        }

        // ─── INIT ───
        async function init() {
            try {
                await loadModel();
                await loadEmbeddings();
                await startCamera();
                startGpsWatch();

                ui.loading.classList.add('hidden');

                STATE.running = true;
                loop();

                // Start GPS tracking
                startGPSTracking();
            } catch (e) {
                ui.loadingStatus.textContent = 'Something went wrong. Please refresh.';
                console.error(e);
            }
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopGPSTracking();
        });

        // Map functionality
        var map = null;
        var userMarker = null;
        var userLat = null;
        var userLng = null;

        function initializeMap() {
            if (map) {
                console.log('[MAP] Map already initialized');
                return;
            }

            console.log('[MAP] Initializing map...');
            var mapContainer = document.getElementById('mini-map');
            if (!mapContainer) {
                console.error('[MAP] Map container not found!');
                return;
            }

            map = L.map(mapContainer, {
                zoomControl: false,
                attributionControl: true
            }).setView([37.3352, -121.8811], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            console.log('[MAP] Map initialized successfully');
        }

        function updateMap() {
            if (!map) {
                console.log('[MAP] Map not initialized, cannot update');
                return;
            }
            if (!userLat || !userLng) {
                console.log('[MAP] No GPS position yet');
                return;
            }

            console.log('[MAP] Updating map with position:', userLat, userLng);
            map.setView([userLat, userLng], 16);

            // Use shared marker system
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.contains('expanded');
            userMarker = updateMapMarkers(map, userLat, userLng, userMarker, isExpanded);
            console.log('[MAP] Map updated with markers');
        }

        document.getElementById('toggle-map').addEventListener('click', function () {
            var mapContainer = document.getElementById('map-container');
            var isExpanded = mapContainer.classList.toggle('expanded');


            setTimeout(function () {
                if (map) {
                    map.invalidateSize();
                    updateMap();
                }
            }, 400);
        });

        if (navigator.geolocation) {
            console.log('[GPS] Starting geolocation watch...');
            navigator.geolocation.watchPosition(
                function (position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    console.log('[GPS] Position updated:', userLat, userLng, 'accuracy:', position.coords.accuracy + 'm');

                    if (!map) {
                        console.log('[GPS] Map not initialized, initializing now...');
                        initializeMap();
                    }
                    updateMap();
                },
                function (error) {
                    console.error('[GPS] Geolocation error:', error.code, error.message);
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        } else {
            console.error('[GPS] Geolocation not supported by this browser');
        }

        setTimeout(function () {
            if (!map) {
                initializeMap();
            }
        }, 1000);

        init();
    </script>

    <!-- GPS Tracking for Checkpoints -->
    <script type="module" src="./src/utils/shared-gps-tracking.js"></script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
