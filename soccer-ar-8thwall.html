<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Soccer AR — Sharks Way</title>
    <meta name="description" content="Place a soccer goal anywhere and take a shot at Sharkie in goal.">
    <meta name="theme-color" content="#006D75">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <!-- Link previews (iMessage, Slack, social). og:image must be an absolute URL. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Soccer AR — Sharks Way">
    <meta property="og:description" content="Place a soccer goal anywhere and take a shot at Sharkie in goal.">
    <meta property="og:url" content="https://klevrlab.github.io/city-project/soccer-ar-8thwall.html">
    <meta property="og:image" content="https://klevrlab.github.io/city-project/assets/icons/og-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- 8th Wall Engine & Extras (2026 Distributed Engine) -->
    <!-- Field log: first script on the page so it sees everything; inert unless ?debug=1 or ?log=1. -->
    <script src="./assets/js/sharks-way-log.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1.0.0/dist/xr.js" crossorigin="anonymous" data-preload-chunks="slam" async></script>
    <script src="./assets/vendor/8frame/8frame-1.5.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js" crossorigin="anonymous" async></script>

    <!-- Project Source -->
    <script type="module" src="./src/utils/audio-utils.js"></script>
    <script type="module" src="./src/utils/math-utils.js"></script>
    <script type="module" src="./src/components/soccer-game.js"></script>
    <script type="module" src="./src/components/net-shader.js"></script>
    <script type="module" src="./src/components/ball-shader.js"></script>
    <script type="module" src="./src/app.js"></script>

    <link rel="stylesheet" href="./src/css/soccer-ar-8thwall-styles.css" />
    <link rel="stylesheet" href="./src/css/navigation.css" />
</head>

<body>
    <div id="topbar">
        <a href="./index.html" class="back" aria-label="Back to home">&larr;</a>
        <h1>Soccer AR Prototype</h1>
        <span id="timer" class="pill" data-ui-overlay>00:30</span>
        <span id="score" class="pill" data-ui-overlay>Goals 0 / 0</span>
    </div>

    <div id="tap-instruction">Loading AR&hellip;</div>
    <div id="toast"></div>

    <button id="reset-btn" class="pill" data-ui-overlay>Reset</button>

    <!-- 8th Wall A-Frame scene -->
    <a-scene id="xrscene"
        xrextras-almost-there
        xrextras-runtime-error
        xrextras-loading
        xrweb
        vr-mode-ui="enabled: false"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true; colorManagement: true;"
        gltf-model="dracoDecoderPath: ./assets/vendor/draco/">

        <!-- Lighting + shadows -->
        <a-entity light="type: ambient; intensity: 0.55;"></a-entity>
        <a-entity light="type: directional; castShadow: true; intensity: 0.85; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowCameraTop: 15; shadowCameraBottom: -15; shadowCameraRight: 15; shadowCameraLeft: -15; target: #camera" position="5 10 5"></a-entity>

        <!-- Shadow Ground Plane (Clickable for placement) -->
        <a-plane id="ground" class="clickable" position="0 0 0" rotation="-90 0 0" width="1000" height="1000" material="shader: shadow; opacity: 0.4;" shadow="receive: true"></a-plane>

        <!-- Soccer field root -->
        <a-entity id="soccer-root" position="0 0 0" soccer-game></a-entity>

        <a-camera id="camera" position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        window.addEventListener('xrloaded', () => {
            console.log('8th Wall Engine Loaded — Soccer Prototype');
        });
    </script>

    <!-- Navigation Component -->
    <script type="module">
        import { initNavigation } from './src/components/navigation.js';
        initNavigation();
    </script>
</body>

</html>
